<form>

    <label for="exampleInputEmail1" class="form-label">Email address</label>

  </div>

  </div>
  <div class="container mt-5 text-center">
    <button type="button" class="btn btn-success w-25" onclick="login()">Login</button>
    <button type="reset" class="btn btn-danger w-25">Borrar</button>
  </div>
</form>
